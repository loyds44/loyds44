name: Update profile statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate statistics card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          mkdir -p assets

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          user = os.environ["GH_USER"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          profile = get_json(
              f"https://api.github.com/users/{user}"
          )

          stars = 0
          forks = 0
          page = 1

          while True:
              repos = get_json(
                  f"https://api.github.com/users/{user}/repos"
                  f"?per_page=100&page={page}&type=owner"
              )
              for repo in repos:
                  if not repo["fork"]:
                      stars += repo["stargazers_count"]
                      forks += repo["forks_count"]

              if len(repos) < 100:
                  break
              page += 1

          stats = [
              ("Public repositories", profile["public_repos"]),
              ("Followers", profile["followers"]),
              ("Stars on original repos", stars),
              ("Forks on original repos", forks),
          ]

          svg = [
              '<svg xmlns="http://www.w3.org/2000/svg" '
              'width="520" height="158" viewBox="0 0 520 158">',
              '<rect width="519" height="157" x=".5" y=".5" '
              'rx="12" fill="#1a1b27" stroke="#414868"/>',
              '<text x="22" y="30" fill="#c0caf5" '
              'font-family="Arial,sans-serif" font-size="14" '
              'font-weight="600">GitHub overview</text>',
          ]

          for i, (label, value) in enumerate(stats):
              x = 22 + (i % 2) * 250
              y = 70 + (i // 2) * 48
              svg.append(
                  f'<text x="{x}" y="{y}" fill="#7aa2f7" '
                  f'font-family="Arial,sans-serif" font-size="22" '
                  f'font-weight="700">{value}</text>'
              )
              svg.append(
                  f'<text x="{x}" y="{y + 17}" fill="#a9b1d6" '
                  f'font-family="Arial,sans-serif" font-size="11">'
                  f'{label}</text>'
              )

          svg.append("</svg>")

          with open("assets/github-stats.svg", "w", encoding="utf-8") as f:
              f.write("\n".join(svg))
          PY

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update profile statistics"
            git push
          fi
